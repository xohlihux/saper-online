<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Сапер Онлайн</title><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#1b1f2a">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1b1f2a;color:#eee;font-family:sans-serif;user-select:none;-webkit-user-select:none}
button,input,select{font-size:18px;padding:10px 14px;margin:5px;border-radius:10px;border:0}
button{background:#3b82f6;color:#fff}
input{text-transform:none;width:150px;text-align:center}
#lobby{text-align:center;padding-top:30px}
#game{display:none;height:100%;flex-direction:column}
#top{padding:4px 8px;font-size:15px;text-align:center}
#cw{flex:1;min-height:0;position:relative}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;background:#11141c}
#bar{text-align:center}
#chat{display:none;position:fixed;left:0;right:0;bottom:0;height:50%;background:#252b3a;flex-direction:column;border-top:2px solid #3b82f6}
#msgs{flex:1;overflow-y:auto;padding:8px;font-size:16px}
#cin{display:flex}#cin input{flex:1;width:auto}
</style></head><body>
<div id="prof"></div><div id="skins"></div><div id="srv"></div><div id="lobby"><h1>💣 Сапер Онлайн</h1>
<input id="name" maxlength="12" placeholder="Твоё имя"><br>
<select id="size"><option value="s">Маленькое 15×15</option><option value="m">Среднее 35×35</option><option value="l">Большое 80×80</option><option value="x">Огромное 120×120</option></select><br><select id="mode"><option value="n">Обычный (с везением)</option><option value="ng">Без угадывания</option></select><br>
<select id="vis"><option value="1">Открытая комната</option><option value="0">Только по коду</option></select><br><button id="create">Создать комнату</button><br>
<input id="code" maxlength="4" placeholder="КОД"><button id="join">Войти</button>
<div><button id="bprof">🏆 Профиль</button><button id="bskin">🚩 Скины</button><button id="bsrv">🌐 Серверы</button></div><p id="err" style="color:#f87171"></p></div>
<div id="game"><div id="top"></div><div id="cw"><canvas id="cv"></canvas></div>
<div id="bar"><button id="chatbtn">💬 Чат</button><button id="restart">Заново</button><button id="menu">Меню</button></div>
<div id="chat"><div id="msgs"></div><div id="cin"><input id="ctext" maxlength="200" placeholder="Сообщение"><button id="csend">➤</button></div><button id="cclose">Закрыть</button></div></div>
<script>
const $=id=>document.getElementById(id);
const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
const send=o=>ws.readyState===1&&ws.send(JSON.stringify(o));
const vib=p=>{try{navigator.vibrate(p)}catch(e){}};
const C=32,NC=['','#2563eb','#16a34a','#dc2626','#7c3aed','#b45309','#0e7490','#111827','#6b7280'];
let N=0,cells=[],own=[],cols=[],players=[],status='play',left=0,code='';
let scale=1,ms=0.1,ox=0,oy=0,dpr=1;
const cv=$('cv'),ctx=cv.getContext('2d');
try{$('name').value=localStorage.getItem('nm')||'';}catch(e){}
const nm=()=>{const v=$('name').value.trim()||'Игрок';try{localStorage.setItem('nm',v);}catch(e){}return v;};
$('create').onclick=()=>send({t:'create',name:nm(),size:$('size').value});
$('join').onclick=()=>send({t:'join',name:nm(),code:$('code').value.trim().toUpperCase()});
$('restart').onclick=()=>{if(confirm('Начать заново?'))send({t:'restart'});};
$('chatbtn').onclick=()=>{$('chat').style.display='flex';$('chatbtn').textContent='💬 Чат';};
$('cclose').onclick=()=>{$('chat').style.display='none';};
const say=()=>{const v=$('ctext').value.trim();if(v){send({t:'chat',text:v});$('ctext').value='';}};
$('csend').onclick=say;
$('ctext').onkeydown=e=>{if(e.key==='Enter')say();};
function addMsg(o){const d=document.createElement('div'),b=document.createElement('b');b.style.color=cols[o.c]||'#fff';b.textContent=o.n+': ';d.appendChild(b);d.appendChild(document.createTextNode(o.x));$('msgs').appendChild(d);$('msgs').scrollTop=1e9;if($('chat').style.display!=='flex')$('chatbtn').textContent='💬 Чат •';}
function resize(){dpr=window.devicePixelRatio||1;cv.width=Math.round(cv.clientWidth*dpr);cv.height=Math.round(cv.clientHeight*dpr);draw();}
window.onresize=resize;
function fit(){const w=cv.clientWidth,h=cv.clientHeight;scale=Math.min(w,h)/(N*C);ms=scale*0.8;ox=(w-N*C*scale)/2;oy=(h-N*C*scale)/2;}
function clamp(){const s=C*scale*N,w=cv.clientWidth,h=cv.clientHeight;ox=Math.min(w*0.8,Math.max(w*0.2-s,ox));oy=Math.min(h*0.8,Math.max(h*0.2-s,oy));}
function zoomAt(x,y,f){const ns=Math.min(2.5,Math.max(ms,scale*f));f=ns/scale;ox=x-(x-ox)*f;oy=y-(y-oy)*f;scale=ns;clamp();}
function cellAt(px,py){const r=cv.getBoundingClientRect(),s=C*scale,x=Math.floor((px-r.left-ox)/s),y=Math.floor((py-r.top-oy)/s);return x>=0&&y>=0&&x<N&&y<N?y*N+x:-1;}
function draw(){
  const w=cv.clientWidth,h=cv.clientHeight,s=C*scale;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);
  if(!N)return;
  const x0=Math.max(0,Math.floor(-ox/s)),y0=Math.max(0,Math.floor(-oy/s));
  const x1=Math.min(N-1,Math.floor((w-ox)/s)),y1=Math.min(N-1,Math.floor((h-oy)/s));
  const g=s>8?1:0;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold '+Math.floor(s*0.6)+'px sans-serif';
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const i=y*N+x,v=cells[i],px=ox+x*s,py=oy+y*s,o=own[i]>0?cols[own[i]-1]:null;
    ctx.fillStyle=v===10?'#e11d48':v===9?'#9ca3af':v===-2?(s<12?'#ef4444':'#3a4254'):v===-1?'#3a4254':(s<12&&o)?o:'#cfd6e4';
    ctx.fillRect(px,py,s-g,s-g);
    if(s<12)continue;
    const cx=px+s/2,cy=py+s/2+1;
    if(v>0&&v<=8){ctx.fillStyle=NC[v];ctx.fillText(v,cx,cy);}
    else if(v>=9)ctx.fillText('💣',cx,cy);
    else if(v===-2)drawFlag(ctx,cx,cy,s,sk[i]||0);
  }
}
const ptr=new Map();let moved=false,longp=false,lp=0,sx=0,sy=0,pd=1;
cv.oncontextmenu=e=>e.preventDefault();
function act(k,px,py){const i=cellAt(px,py);if(i<0)return;vib(k==='flag'?40:15);const v=cells[i];send(k==='flag'?{t:'flag',i}:{t:v>=1&&v<=8?'chord':'open',i});}
cv.onpointerdown=e=>{if(e.isPrimary){ptr.clear();clearTimeout(lp);}cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptr.size===1){moved=false;longp=false;sx=e.clientX;sy=e.clientY;lp=setTimeout(()=>{if(!moved&&ptr.size===1){longp=true;act('flag',sx,sy);}},330);}
  else{moved=true;clearTimeout(lp);const [a,b]=[...ptr.values()];pd=Math.hypot(a.x-b.x,a.y-b.y)||1;}};
cv.onpointermove=e=>{const p=ptr.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptr.size===1){
    if(!moved&&Math.hypot(e.clientX-sx,e.clientY-sy)>14){moved=true;clearTimeout(lp);}
    if(moved){ox+=dx;oy+=dy;clamp();draw();}
  }else if(ptr.size===2){
    const [a,b]=[...ptr.values()],d=Math.hypot(a.x-b.x,a.y-b.y)||1,r=cv.getBoundingClientRect();
    zoomAt((a.x+b.x)/2-r.left,(a.y+b.y)/2-r.top,d/pd);pd=d;draw();}};
cv.onpointerup=e=>{clearTimeout(lp);const had=ptr.delete(e.pointerId);
  if(had&&!moved&&!longp&&ptr.size===0)act('tap',e.clientX,e.clientY);};
cv.onpointercancel=e=>{clearTimeout(lp);ptr.delete(e.pointerId);};
let flg=0,tot=0,base=0,at0=0,running=false,gmode='n';
const secs=()=>Math.floor((base+(running?Date.now()-at0:0))/1000);
function sync(m){base=m.el;at0=Date.now();running=m.run;}
setInterval(()=>{const e=$('tm');if(e)e.textContent=secs()+' с';},500);
function drawTop(){
  const t=$('top');t.textContent='';
  const a=document.createElement('div');a.id='info';
  const l1=document.createElement('div');
  l1.append('Комната '+code+(gmode==='ng'?' 🧠':'')+' · ⏱ ');
  const sp=document.createElement('span');sp.id='tm';sp.textContent=secs()+' с';l1.appendChild(sp);
  const l2=document.createElement('div');l2.textContent='🚩 '+flg+' из '+tot;
  a.append(l1,l2);
  if(status!=='play'){const l3=document.createElement('div');l3.textContent=status==='won'?'🎉 Победа!':'💥 Бабах!';a.appendChild(l3);}
  const b=document.createElement('div');b.id='lb';
  [...players].sort((x,y)=>y.s-x.s).forEach(p=>{const d=document.createElement('div'),n=document.createElement('b');n.style.color=cols[p.c]||'#fff';n.textContent=p.n;d.append(n,' — '+p.s);b.appendChild(d);});
  t.append(a,b);
}
$('create').onclick=()=>send({t:'create',name:nm(),size:$('size').value,mode:$('mode').value});
$('menu').onclick=()=>{
  if(status==='play'&&N>0&&!confirm('Выйти в меню?'))return;
  send({t:'leave'});$('chat').style.display='none';$('game').style.display='none';$('lobby').style.display='block';
  N=0;status='play';$('err').textContent='';
};
const RAR=[['Обычный','#9ca3af'],['Редкий','#3b82f6'],['Эпический','#a855f7'],['Легендарный','#f59e0b']];
const SK=[
 {n:'Красный',r:0,c:'#ef4444'},{n:'Синий',r:0,c:'#3b82f6'},{n:'Зелёный',r:0,c:'#22c55e'},
 {n:'Жёлтый',r:0,c:'#eab308'},{n:'Фиолетовый',r:0,c:'#a855f7'},{n:'Оранжевый',r:0,c:'#f97316'},
 {n:'Пиратский',r:1,e:'🏴‍☠️',g:'#3b82f6'},{n:'Финишный',r:1,e:'🏁',g:'#3b82f6'},
 {n:'Самурайский',r:1,e:'🎌',g:'#3b82f6'},{n:'Радужный',r:1,e:'🏳️‍🌈',g:'#3b82f6'},
 {n:'Трезубец',r:2,e:'🔱',g:'#a855f7'},{n:'Лилия',r:2,e:'⚜️',g:'#a855f7'},
 {n:'Дракон',r:2,e:'🐲',g:'#a855f7'},{n:'Щит',r:2,e:'🛡️',g:'#a855f7'},
 {n:'Корона',r:3,e:'👑',g:'#f59e0b'},{n:'Бриллиант',r:3,e:'💎',g:'#f59e0b'},
 {n:'Огонь',r:3,e:'🔥',g:'#f59e0b'},{n:'Комета',r:3,e:'☄️',g:'#f59e0b'}];
let sk=[],vote=null,prevVisit=0,P={},srvT=0;
function saveP(){try{localStorage.setItem('sap',JSON.stringify(P));}catch(e){}}
try{P=JSON.parse(localStorage.getItem('sap'))||{};}catch(e){P={};}
P.since=P.since||Date.now();P.wins=P.wins||{n:0,ng:0};P.best=P.best||{n:{},ng:{}};P.own=P.own||[0];P.eq=P.eq||0;
prevVisit=P.last||Date.now();P.last=Date.now();saveP();
const mk=(t,txt,css)=>{const e=document.createElement(t);if(txt)e.textContent=txt;if(css)e.style.cssText=css;return e;};
function scr(id){['lobby','prof','skins','srv'].forEach(x=>{$(x).style.display=x===id?'block':'none';});if(id!=='srv')clearInterval(srvT);}
const back=()=>{const b=mk('button','← Назад');b.onclick=()=>scr('lobby');return b;};
function toast(t,c){const d=mk('div',t,'position:fixed;left:10px;right:10px;top:90px;z-index:9;background:#252b3a;border:3px solid '+c+';border-radius:12px;padding:14px;text-align:center;font-size:18px');document.body.appendChild(d);setTimeout(()=>d.remove(),4500);}
function drawFlag(c,cx,cy,s,id){
  const k=SK[id]||SK[0];
  if(k.e){if(k.g){c.shadowColor=k.g;c.shadowBlur=s*0.3;}c.fillText(k.e,cx,cy);c.shadowBlur=0;return;}
  const x=cx-s*0.2,y=cy-s*0.34,w=s*0.07;
  c.fillStyle='#e5e7eb';c.fillRect(x,y,w,s*0.68);
  c.fillStyle=k.c;c.beginPath();c.moveTo(x+w,y);c.lineTo(x+s*0.6,y+s*0.2);c.lineTo(x+w,y+s*0.4);c.closePath();c.fill();
}
function showProf(){
  const d=$('prof');d.textContent='';
  const fd=t=>new Date(t).toLocaleString('ru-RU');
  d.append(mk('h2','🏆 Профиль'),mk('p','В игре с: '+fd(P.since)),mk('p','Последний заход: '+fd(prevVisit)),
    mk('p','Победы: обычный — '+P.wins.n+', без угадывания — '+P.wins.ng),mk('h3','Лучшее время'));
  [15,35,80,120].forEach(n=>{const f=m=>P.best[m][n]!==undefined?(P.best[m][n]/1000).toFixed(1)+' с':'—';d.append(mk('p',n+'×'+n+': обычный '+f('n')+' · без угад. '+f('ng')));});
  d.append(back());scr('prof');
}
function showSkins(){
  const d=$('skins');d.textContent='';
  d.append(mk('h2','🚩 Скины флажков'),mk('p','Выпадают после победы. Нажми на открытый скин, чтобы выбрать.'));
  const g=mk('div','','display:flex;flex-wrap:wrap;justify-content:center;gap:8px');
  SK.forEach((k,i)=>{
    const own=P.own.includes(i),col=RAR[k.r][1];
    const b=mk('div','','width:90px;padding:6px;border-radius:10px;background:#252b3a;border:3px solid '+(P.eq===i?'#fff':col)+';opacity:'+(own?1:0.4));
    const cvs=document.createElement('canvas');cvs.width=64;cvs.height=64;
    const c=cvs.getContext('2d');c.textAlign='center';c.textBaseline='middle';c.font='36px sans-serif';
    if(own)drawFlag(c,32,32,56,i);else{c.fillStyle='#888';c.fillText('?',32,32);}
    b.append(cvs,mk('div',own?k.n:'???','font-size:13px'),mk('div',RAR[k.r][0],'font-size:11px;color:'+col));
    if(own)b.onclick=()=>{P.eq=i;saveP();showSkins();};
    g.appendChild(b);
  });
  d.append(g,back());scr('skins');
}
const askRooms=()=>send({t:'list'});
function showSrv(){scr('srv');askRooms();clearInterval(srvT);srvT=setInterval(askRooms,3000);}
function renderRooms(list){
  const d=$('srv');d.textContent='';
  d.append(mk('h2','🌐 Серверы'),mk('p','Комнаты, где игроки ждут начала игры'));
  if(!list.length)d.append(mk('p','Пока никого нет. Создай свою комнату!','color:#9ca3af'));
  list.forEach(r=>{
    const row=mk('div','','background:#252b3a;border-radius:10px;padding:8px;margin:8px auto;max-width:340px;text-align:left');
    row.append(mk('div',r.code+' · '+r.N+'×'+r.N+(r.md==='ng'?' · 🧠':''),'font-weight:bold'),mk('div','Ждут ('+r.pl.length+'): '+r.pl.join(', '),'font-size:14px'));
    const b=mk('button','Войти');b.onclick=()=>send({t:'join',name:nm(),code:r.code,skin:P.eq});row.appendChild(b);d.appendChild(row);
  });
  const b=mk('button','Обновить');b.onclick=askRooms;d.append(b,back());
}
$('bprof').onclick=showProf;$('bskin').onclick=showSkins;$('bsrv').onclick=showSrv;
$('create').onclick=()=>send({t:'create',name:nm(),size:$('size').value,mode:$('mode').value,vis:$('vis').value==='1',skin:P.eq});
$('join').onclick=()=>send({t:'join',name:nm(),code:$('code').value.trim().toUpperCase(),skin:P.eq});
$('restart').onclick=()=>{if(status==='play'&&!confirm('Начать заново?'))return;send({t:'vote',a:'restart'});};
function voteLabel(){const b=$('restart');if(!vote){b.textContent='Заново';return;}b.textContent='Заново '+vote.n+'/'+vote.of+' · '+Math.max(0,Math.ceil((vote.end-Date.now())/1000))+' с';}
setInterval(voteLabel,250);
$('menu').onclick=()=>{
  if(status==='play'&&N>0&&!confirm('Выйти в меню?'))return;
  send({t:'leave'});$('chat').style.display='none';$('game').style.display='none';scr('lobby');
  N=0;status='play';vote=null;$('err').textContent='';
};
function onWin(m){
  const md=m.md==='ng'?'ng':'n';P.wins[md]++;
  const b=P.best[md][m.N];if(b===undefined||m.el<b)P.best[md][m.N]=m.el;
  const r=Math.random()*100,rar=r<2?3:r<7.5?2:r<15.5?1:r<30.5?0:-1;let msg='';
  if(rar>=0){
    const fresh=SK.map((k,i)=>i).filter(i=>SK[i].r===rar&&!P.own.includes(i));
    if(fresh.length){const i=fresh[Math.floor(Math.random()*fresh.length)];P.own.push(i);msg='🎁 Новый скин: '+SK[i].n+' ('+RAR[rar][0]+')!';}
    else msg='🎁 Выпал скин ('+RAR[rar][0].toLowerCase()+'), но такие у тебя уже есть';
  }
  saveP();if(msg)toast(msg,RAR[rar][1]);
}
function onFull(m){
  scr('none');$('game').style.display='flex';
  const first=N!==m.N,won=!first&&status==='play'&&m.status==='won';
  cols=m.cols;cells=m.cells;own=m.own;sk=m.sk;players=m.pl;flg=m.fl;tot=m.M;gmode=m.md;code=m.code;sync(m);vote=null;voteLabel();
  $('msgs').textContent='';m.chat.forEach(addMsg);$('chatbtn').textContent='💬 Чат';
  if(m.status!==status){if(m.status==='lost')vib([200,80,300]);if(m.status==='won')vib([80,60,80,60,250]);}
  status=m.status;N=m.N;resize();if(first)fit();
  if(won)onWin(m);
}
ws.onclose=()=>{$('err').textContent='Связь потеряна, обнови страницу';};
ws.onmessage=e=>{
  const m=JSON.parse(e.data);
  if(m.t==='error'){if($('srv').style.display==='block')alert(m.msg);else $('err').textContent=m.msg;return;}
  if(m.t==='rooms'){renderRooms(m.list);return;}
  if(m.t==='vote'){vote={n:m.n,of:m.of,end:Date.now()+m.ms};voteLabel();return;}
  if(m.t==='chat'){addMsg(m);return;}
  if(m.t==='pl')players=m.pl;
  if(m.t==='diff'){m.ch.forEach(([i,v,o,f])=>{cells[i]=v;own[i]=o;sk[i]=f;});flg=m.fl;players=m.pl;sync(m);}
  if(m.t==='full')onFull(m);
  drawTop();draw();
};
</script>
<style>
#top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;text-align:left}
#info{line-height:1.6}
#lb{max-height:78px;overflow-y:auto;font-size:14px;line-height:1.4;min-width:120px}
#lb div{white-space:nowrap}
#prof,#skins,#srv{display:none;text-align:center;padding:16px;height:100%;overflow-y:auto;box-sizing:border-box}
</style>
<script>
new ResizeObserver(()=>resize()).observe($('cw'));
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
</script></body></html>
